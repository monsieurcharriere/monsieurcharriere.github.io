<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronomètre d'entraînement</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      background: #0a0f1a;
      color: #fff;
      font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      display: grid;
      grid-template-columns: 380px 1fr;
      width: 100%;
      max-width: 1700px;
      height: calc(100vh - 32px);
      min-height: 560px;
      background: #06182b;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }

    /* ---------- Left panel ---------- */
    .panel {
      background: #0b2038;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #5db4ff;
      text-transform: uppercase;
    }

    .panel h1 {
      margin: 4px 0 0;
      font-size: 1.9rem;
      line-height: 1.1;
    }

    .tod {
      font-size: clamp(2.6rem, 5.2vw, 4.4rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      line-height: 1;
      padding: 18px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .tod small {
      display: block;
      margin-bottom: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #9fb3c8;
      text-transform: uppercase;
    }

    .label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #9fb3c8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .legend span { display: flex; align-items: center; gap: 8px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

    .toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #16304d;
      border-radius: 14px;
      padding: 5px;
    }

    .toggle button {
      border: 0;
      background: transparent;
      color: #b6c4d4;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle button.active { background: #fff; color: #0b2038; }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #16304d;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #12293f;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.primary { background: #0a84ff; border-color: #0a84ff; }
    .btn.small { font-size: 0.85rem; padding: 12px; color: #d0dbe6; }
    .types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .types button {
      padding: 11px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #12293f;
      color: #d0dbe6;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .types button.active { background: #2b5c94; border-color: #4a86c5; color: #fff; }

    .settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .settings label { font-size: 0.7rem; font-weight: 700; color: #9fb3c8; letter-spacing: 0.06em; text-transform: uppercase; }
    .settings input {
      width: 100%;
      margin-top: 4px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #16304d;
      color: #fff !important;
      font-size: 1rem;
      font-weight: 600;
    }

    .timer-view { display: none; }
    .stage.timer-mode .clock-view { display: none; }
    .stage.timer-mode .timer-view { display: block; }
    .stage.timer-mode .sendoff { display: none; }
    .ring-bg { fill: none; stroke: #1c2733; stroke-width: 10; }
    .stage.timer-mode { background: #000; }
    .ring-fg { fill: none; stroke-width: 10; stroke-linecap: butt; transform: rotate(-90deg); transform-origin: 200px 200px; }
    #tDigits { font-weight: 900; }

    .btn.active { background: #2b5c94; border-color: #4a86c5; color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .stats {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .stats .k { font-size: 0.75rem; color: #9fb3c8; margin-bottom: 4px; }
    .stats .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .home { font-size: 0.8rem; text-align: center; }
    .home a { color: #9fb3c8; text-decoration: none; }
    .home a:hover { color: #fff; }

    /* ---------- Clock side ---------- */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 50%, #0a2036 0%, #06182b 70%);
    }

    .stage svg {
      width: min(100%, calc(100vh - 100px));
      height: auto;
      max-height: 100%;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.6));
    }

    .sendoff {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 250px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(11, 32, 56, 0.8);
    }

    .sendoff .row { display: flex; justify-content: space-between; align-items: center; }
    .sendoff .t { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; color: #9fb3c8; }
    .sendoff .n { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; border-radius: 3px; background: #1d3855; margin: 10px 0 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #0a84ff; }
    .sendoff .sub { display: flex; justify-content: space-between; font-size: 0.65rem; color: #9fb3c8; }

    /* Visible mode: hide the panel, clock fills the screen */
    body.visible { padding: 0; }
    body.visible .app { grid-template-columns: 1fr; height: 100vh; border-radius: 0; max-width: none; }
    body.visible .panel { display: none; }
    body.visible .stage { cursor: pointer; }
    body.visible .stage svg { width: min(100%, 100vh); }

    .tod-overlay {
      display: none;
      position: absolute;
      top: 24px;
      left: 28px;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    body.visible .tod-overlay { display: block; }

    @media (max-width: 900px) {
      body { padding: 0; align-items: flex-start; }
      .app { grid-template-columns: 1fr; height: auto; border-radius: 0; }
      .stage { order: -1; padding: 12px; flex-direction: column; }
      .stage svg { width: 100%; }
      .sendoff { position: static; margin-top: 12px; width: 100%; }
      .panel { border-right: 0; }
    }
  </style>
</head>
<body>

<div class="app">

  <aside class="panel">
    <div>
      <div class="eyebrow">Workout Timer</div>
      <h1>Chronomètre d'entraînement</h1>
    </div>

    <div class="tod" aria-live="off">
      <small>Heure</small>
      <span id="tod">--:--:--</span>
    </div>

    <div id="legendBox">
      <div class="label">Départ des aiguilles</div>
      <div class="legend">
        <span><i class="dot" style="background:#ffffff"></i>00 secondes</span>
        <span><i class="dot" style="background:#2ecc5b"></i>15 secondes</span>
        <span><i class="dot" style="background:#ffd60a"></i>30 secondes</span>
        <span><i class="dot" style="background:#ff453a"></i>45 secondes</span>
      </div>
    </div>

    <div class="toggle" role="tablist">
      <button type="button" id="modeWall">Horloge murale</button>
      <button type="button" id="modeSession" class="active">Entraînement</button>
    </div>

    <div id="typeBox" hidden>
      <div class="label">Type d'entraînement</div>
      <div class="types">
        <button type="button" data-type="pace" class="active">Intervalles</button>
        <button type="button" data-type="tabata">TABATA</button>
        <button type="button" data-type="emom">EMOM</button>
        <button type="button" data-type="amrap">AMRAP / Minuterie</button>
      </div>
      <div class="settings" id="settings">
        <label id="rowWork">Travail (s)<input type="number" id="setWork" value="20" min="1"></label>
        <label id="rowRest">Repos (s)<input type="number" id="setRest" value="10" min="0"></label>
        <label id="rowRounds">Rondes<input type="number" id="setRounds" value="8" min="1"></label>
        <label id="rowMinutes">Minutes<input type="number" id="setMinutes" value="10" min="1"></label>
      </div>
    </div>

    <div id="intervalBox">
      <label id="wallIntervalLabel" for="interval" class="label" style="display:block;text-transform:none;font-size:0.9rem;color:#fff;letter-spacing:0">Intervalle de départ</label>
      <select id="interval">
        <option value="15">15 secondes</option>
        <option value="20">20 secondes</option>
        <option value="30">30 secondes</option>
        <option value="45">45 secondes</option>
        <option value="60" selected>1 minute</option>
        <option value="90">1 min 30</option>
        <option value="120">2 minutes</option>
      </select>
      <label id="workoutIntervalLabel" for="workoutInterval" class="label" style="display:block;text-transform:none;font-size:0.9rem;color:#fff;letter-spacing:0" hidden>Durée de l'intervalle</label>
      <select id="workoutInterval" hidden>
        <option value="10">10 secondes</option>
        <option value="20">20 secondes</option>
        <option value="30">30 secondes</option>
        <option value="40">40 secondes</option>
        <option value="50">50 secondes</option>
        <option value="60" selected>1 minute</option>
        <option value="70">1 min 10</option>
        <option value="80">1 min 20</option>
        <option value="90">1 min 30</option>
        <option value="100">1 min 40</option>
        <option value="110">1 min 50</option>
        <option value="120">2 minutes</option>
        <option value="130">2 min 10</option>
        <option value="140">2 min 20</option>
        <option value="150">2 min 30</option>
        <option value="160">2 min 40</option>
        <option value="170">2 min 50</option>
        <option value="180">3 minutes</option>
        <option value="190">3 min 10</option>
        <option value="200">3 min 20</option>
        <option value="210">3 min 30</option>
        <option value="220">3 min 40</option>
        <option value="230">3 min 50</option>
        <option value="240">4 minutes</option>
        <option value="250">4 min 10</option>
        <option value="260">4 min 20</option>
        <option value="270">4 min 30</option>
        <option value="280">4 min 40</option>
        <option value="290">4 min 50</option>
        <option value="300">5 minutes</option>
      </select>
    </div>

    <div id="paceDisplayBox" hidden>
      <div class="label">Affichage des intervalles</div>
      <div class="toggle" role="group" aria-label="Affichage des intervalles">
        <button type="button" id="displayDigital" class="active" aria-pressed="true">Numérique</button>
        <button type="button" id="displayAnalog" aria-pressed="false">Horloge de nage</button>
      </div>
    </div>

    <div class="btn-row" id="workoutActions">
      <button type="button" class="btn primary" id="startBtn">&#9654; Démarrer</button>
      <button type="button" class="btn" id="resetBtn">&#8635; Réinitialiser</button>
    </div>
    <div class="btn-row" id="workoutOptions">
      <button type="button" class="btn small" id="soundBtn">Son activé</button>
      <button type="button" class="btn small" id="visibleBtn">Mode visible</button>
    </div>
    <button type="button" class="btn small" id="preBtn">Compte à rebours de 10 s : activé</button>

    <div class="stats" id="stats">
      <div class="k" id="elapsedLabel">Heure</div>
      <div class="v" id="elapsed">00:00:00</div>
    </div>

    <div class="home"><a href="https://monsieurcharriere.github.io">Revenir au site</a></div>
  </aside>

  <main class="stage" id="stage">
    <div class="tod-overlay" id="todOverlay"></div>

    <svg class="clock-view" viewBox="0 0 400 400" role="img" aria-label="Horloge de pacing à quatre aiguilles">
      <circle cx="200" cy="200" r="196" fill="#151515"/>
      <circle cx="200" cy="200" r="178" fill="#000"/>
      <g id="ticks"></g>
      <g id="nums"></g>
      <g id="hands"></g>
      <circle cx="200" cy="200" r="19" fill="#fff"/>
      <text id="preText" x="200" y="300" fill="#5ac8fa" font-size="80" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Inter, sans-serif"></text>
    </svg>

    <svg class="timer-view" viewBox="0 0 400 400" role="img" aria-label="Minuterie">
      <circle class="ring-bg" cx="200" cy="200" r="175"/>
      <circle class="ring-fg" id="ringFg" cx="200" cy="200" r="175" stroke="#00ff00"/>
      <text id="tLabel" x="200" y="110" fill="#fff" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Inter, sans-serif" letter-spacing="3"></text>
      <text id="tDigits" x="200" y="205" fill="#fff" font-size="104" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Inter, sans-serif" style="font-variant-numeric: tabular-nums"></text>
      <text id="tSub" x="200" y="290" fill="#9fb3c8" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Inter, sans-serif"></text>
    </svg>

    <div class="sendoff" id="sendoff">
      <div class="row"><span class="t">PROCHAIN DÉPART</span><span class="n" id="nextSend2">00:00.0</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="sub"><span id="modeLabel">Horloge murale</span><span id="cycleLabel">cycle de 60 s</span></div>
    </div>
  </main>

</div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const C = 200;

function el(name, attrs, parent) {
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
}

/* Face: ticks and numbers */
const ticks = document.getElementById("ticks");
const nums = document.getElementById("nums");
for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const a = (i * 6 - 90) * Math.PI / 180;
    const r1 = major ? 140 : 156;
    const r2 = 170;
    el("line", {
        x1: C + r1 * Math.cos(a), y1: C + r1 * Math.sin(a),
        x2: C + r2 * Math.cos(a), y2: C + r2 * Math.sin(a),
        stroke: major ? "#fff" : "#8a8a8a",
        "stroke-width": major ? 3 : 1.2
    }, ticks);
    if (major) {
        const t = el("text", {
            x: C + 112 * Math.cos(a), y: C + 112 * Math.sin(a),
            fill: "#fff", "font-size": 28, "font-weight": 700,
            "text-anchor": "middle", "dominant-baseline": "central",
            "font-family": "Segoe UI, Inter, sans-serif"
        }, nums);
        t.textContent = i === 0 ? "60" : i;
    }
}

/* Four tapered hands, starting at 0 / 15 / 30 / 45 seconds */
const HANDS = [
    { color: "#f5f5f7", offset: 0 },
    { color: "#2ecc5b", offset: 15 },
    { color: "#ffd60a", offset: 30 },
    { color: "#ff453a", offset: 45 }
];
const handsG = document.getElementById("hands");
HANDS.forEach(h => {
    h.node = el("polygon", {
        points: `${C - 7},${C + 4} ${C + 7},${C + 4} ${C + 1.5},${C - 165} ${C - 1.5},${C - 165}`,
        fill: h.color
    }, handsG);
});

/* State */
let mode = "session";     // "wall" | "session"
let running = false;
let sessionStart = null;  // ms
let soundOn = true;
let preEnd = null;        // ms, end of the pre-workout countdown
let preCeil = null;
let pausedAt = null;      // ms timestamp while paused
let type = "pace";        // "pace" | "tabata" | "emom" | "amrap"
let timer = null;         // { phases, idx, phaseStart, workoutStart, ceil }
let preCountdownOn = true;
let lastCycle = null;
let lastCeil = null;
let audioCtx = null;

const $ = id => document.getElementById(id);
const pad = (n, l = 2) => String(n).padStart(l, "0");

function tone(freq, duration, volume) {
    if (!soundOn || mode !== "session") return;
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const t0 = audioCtx.currentTime;
        o.frequency.value = freq;
        g.gain.setValueAtTime(volume, t0);
        g.gain.setValueAtTime(volume, t0 + duration * 0.8);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + duration);
    } catch (e) {}
}

const countdownBeep = () => tone(440, 0.15, 0.3);
const startBeep = () => tone(880, 0.9, 0.35);

function unlockAudio() {
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, unlockAudio));

const COLORS = { prep: "#00eaff", work: "#00ff00", rest: "#ff00bf", done: "#ffffff" };
const num = (id, d) => Math.max(0, parseInt($(id).value, 10) || d);

function buildPhases(withPrep) {
    const p = [];
    if (withPrep) p.push({ name: "PRÊT", dur: 10, color: COLORS.prep, kind: "prep" });
    if (type === "tabata") {
        const w = Math.max(1, num("setWork", 20)), r = num("setRest", 10), n = Math.max(1, num("setRounds", 8));
        for (let i = 1; i <= n; i++) {
            p.push({ name: "TRAVAIL", dur: w, color: COLORS.work, kind: "work", sub: `Ronde ${i} / ${n}` });
            if (r > 0) p.push({ name: "REPOS", dur: r, color: COLORS.rest, kind: "rest", sub: `Ronde ${i} / ${n}` });
        }
    } else if (type === "emom") {
        const n = Math.max(1, num("setMinutes", 10));
        for (let i = 1; i <= n; i++) {
            p.push({ name: "EMOM", dur: 60, color: COLORS.work, kind: "work", sub: `Minute ${i} / ${n}` });
        }
    } else if (type === "amrap") {
        const n = Math.max(1, num("setMinutes", 10));
        p.push({ name: "AMRAP", dur: n * 60, color: COLORS.work, kind: "work", sub: `${n} ${n > 1 ? "minutes" : "minute"}` });
    }
    return p;
}

const fmtMS = sec => {
    const c = Math.max(0, Math.ceil(sec - 1e-6));
    return `${pad(Math.floor(c / 60))}:${pad(c % 60)}`;
};

const nowMs = () => pausedAt !== null ? pausedAt : Date.now();

function togglePause() {
    if (pausedAt === null) {
        pausedAt = Date.now();
    } else {
        const d = Date.now() - pausedAt;
        pausedAt = null;
        if (timer) { timer.phaseStart += d; timer.workoutStart += d; }
        if (sessionStart) sessionStart += d;
        if (preEnd) preEnd += d;
    }
    updateStartBtn();
}

function timerActive() { return !!timer && !timer.done; }

function startTimer() {
    const phases = buildPhases(preCountdownOn);
    if (!phases.length) return;
    const now = Date.now();
    timer = { phases, idx: 0, phaseStart: now, workoutStart: now, ceil: null, done: false };
    if (phases[0].kind !== "prep") startBeep();
    updateStartBtn();
}

function stopTimer() { timer = null; pausedAt = null; updateStartBtn(); }

function renderTimer() {
    const ring = $("ringFg");
    const C2 = 2 * Math.PI * 175;
    ring.setAttribute("stroke-dasharray", C2);

    let phase, rem, dur, total = 0, elapsedWork = 0;
    if (timer && !timer.done) {
        const now = nowMs();
        phase = timer.phases[timer.idx];
        let el = (now - timer.phaseStart) / 1000;
        while (el >= phase.dur) {
            timer.idx++;
            timer.phaseStart += phase.dur * 1000;
            if (timer.idx >= timer.phases.length) {
                timer.done = true;
                startBeep();
                updateStartBtn();
                break;
            }
            phase = timer.phases[timer.idx];
            if (phase.kind === "rest") tone(440, 0.5, 0.3); else startBeep();
            timer.ceil = null;
            el = (now - timer.phaseStart) / 1000;
        }
        if (!timer.done) {
            dur = phase.dur;
            rem = dur - el;
            const c = Math.ceil(rem);
            if (c !== timer.ceil) {
                if (c <= 3 && c >= 1 && dur > 3) countdownBeep();
                timer.ceil = c;
            }
            total = timer.phases.slice(timer.idx + 1).reduce((a, p) => a + p.dur, 0) + rem;
            ring.setAttribute("stroke", phase.color);
            ring.setAttribute("stroke-dashoffset", C2 * (1 - el / dur));
            $("tLabel").textContent = phase.name;
            $("tLabel").setAttribute("fill", phase.color);
            $("tDigits").textContent = fmtMS(rem);
            $("tDigits").setAttribute("fill", phase.color);
            $("tSub").textContent = (phase.sub ? phase.sub + " · " : "") + (phase.kind === "prep" ? "" : "Restant " + fmtMS(total));
            const e = Math.floor((now - timer.workoutStart) / 1000);
            $("elapsed").textContent = `${pad(Math.floor(e / 3600))}:${pad(Math.floor(e / 60) % 60)}:${pad(e % 60)}`;
            return;
        }
    }
    if (timer && timer.done) {
        ring.setAttribute("stroke", COLORS.done);
        ring.setAttribute("stroke-dashoffset", 0);
        $("tLabel").textContent = "TERMINÉ";
        $("tLabel").setAttribute("fill", COLORS.done);
        $("tDigits").textContent = "00:00";
        $("tDigits").setAttribute("fill", COLORS.done);
        $("tSub").textContent = "Bon travail !";
        return;
    }
    /* Idle preview */
    const prev = buildPhases(false)[0];
    ring.setAttribute("stroke", COLORS.work);
    ring.setAttribute("stroke-dashoffset", C2);
    $("tLabel").textContent = "PRÊT";
    $("tLabel").setAttribute("fill", COLORS.work);
    $("tDigits").textContent = prev ? fmtMS(prev.dur) : "00:00";
    $("tDigits").setAttribute("fill", COLORS.work);
    $("tSub").textContent = prev && prev.sub ? prev.sub : "";
    $("elapsed").textContent = "00:00:00";
}

const TYPE_ROWS = {
    pace: [], tabata: ["rowWork", "rowRest", "rowRounds"], emom: ["rowMinutes"], amrap: ["rowMinutes"]
};

let paceDisplay = "digital";

function setType(tp) {
    type = tp;
    stopTimer();
    if (tp === "tabata") { $("setWork").value = 20; $("setRest").value = 10; $("setRounds").value = 8; }
    if (tp === "emom" || tp === "amrap") $("setMinutes").value = 10;
    applyView();
}

function applyView() {
    const sess = mode === "session";
    const pace = type === "pace";
    const digitalPace = sess && pace && paceDisplay === "digital";
    $("typeBox").hidden = !sess;
    $("paceDisplayBox").hidden = !sess || !pace;
    $("legendBox").hidden = sess && (!pace || digitalPace);
    $("intervalBox").hidden = !sess || !pace;
    $("wallIntervalLabel").hidden = sess;
    $("interval").hidden = sess;
    $("workoutIntervalLabel").hidden = !sess;
    $("workoutInterval").hidden = !sess;
    $("elapsedLabel").textContent = sess ? "Temps d'entraînement" : "Heure";
    $("workoutActions").hidden = !sess;
    $("workoutOptions").hidden = !sess;
    $("preBtn").hidden = !sess;
    $("sendoff").hidden = !sess;
    $("stage").classList.toggle("timer-mode", sess && (!pace || digitalPace));
    for (const [id, display] of [["displayDigital", "digital"], ["displayAnalog", "analog"]]) {
        const selected = paceDisplay === display;
        $(id).classList.toggle("active", selected);
        $(id).setAttribute("aria-pressed", String(selected));
    }
    document.querySelectorAll(".types button").forEach(b => b.classList.toggle("active", b.dataset.type === type));
    ["rowWork", "rowRest", "rowRounds", "rowMinutes"].forEach(id => {
        $(id).hidden = !TYPE_ROWS[type].includes(id);
    });
    $("settings").hidden = pace;
}

document.querySelectorAll(".types button").forEach(b => b.onclick = () => setType(b.dataset.type));
$("displayDigital").onclick = () => { paceDisplay = "digital"; applyView(); };
$("displayAnalog").onclick = () => { paceDisplay = "analog"; applyView(); };

function setMode(m) {
    mode = m;
    $("modeWall").classList.toggle("active", m === "wall");
    $("modeSession").classList.toggle("active", m === "session");
    $("modeLabel").textContent = m === "wall" ? "Horloge murale" : "Entraînement";
    $("startBtn").disabled = m === "wall";
    $("resetBtn").disabled = m === "wall";
    updateSoundBtn();
    updatePreBtn();
    if (m === "wall") { running = false; sessionStart = null; preEnd = null; timer = null; pausedAt = null; }
    lastCycle = null; lastCeil = null;
    updateInterval();
    applyView();
    updateStartBtn();
}

function updateStartBtn() {
    const active = running || preEnd || timerActive();
    $("startBtn").innerHTML = !active ? "&#9654; Démarrer" : (pausedAt !== null ? "&#9654; Reprendre" : "&#10074;&#10074; Pause");
}

$("modeWall").onclick = () => setMode("wall");
$("modeSession").onclick = () => setMode("session");

$("startBtn").onclick = () => {
    if (mode !== "session") return;
    if (type !== "pace") {
        if (timerActive()) togglePause(); else startTimer();
        return;
    }
    if (running || preEnd) { togglePause(); return; }
    if (preCountdownOn) { preEnd = Date.now() + 10000; preCeil = null; }
    else { sessionStart = Date.now(); running = true; lastCycle = null; lastCeil = null; }
    updateStartBtn();
};

$("preBtn").onclick = () => {
    preCountdownOn = !preCountdownOn;
    updatePreBtn();
};

$("resetBtn").onclick = () => {
    running = false; sessionStart = null; preEnd = null; timer = null; pausedAt = null; lastCycle = null; lastCeil = null;
    updateStartBtn();
};

function updateSoundBtn() {
    const btn = $("soundBtn");
    btn.disabled = mode !== "session";
    const on = mode === "session" && soundOn;
    btn.textContent = on ? "Son activé" : "Son désactivé";
    btn.classList.toggle("active", on);
}

function updatePreBtn() {
    const btn = $("preBtn");
    const on = mode === "session" && preCountdownOn;
    btn.disabled = mode !== "session";
    btn.textContent = "Compte à rebours de 10 s : " + (on ? "activé" : "désactivé");
    btn.classList.toggle("active", on);
}

$("soundBtn").onclick = () => {
    soundOn = !soundOn;
    updateSoundBtn();
    if (soundOn) countdownBeep();
};

function currentInterval() {
    return Number($(mode === "session" ? "workoutInterval" : "interval").value);
}

function updateInterval() {
    $("cycleLabel").textContent = "cycle de " + currentInterval() + " s";
    lastCycle = null; lastCeil = null;
}

$("interval").onchange = updateInterval;
$("workoutInterval").onchange = updateInterval;

function setVisible(on) {
    document.body.classList.toggle("visible", on);
    if (on && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else if (!on && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }
}

$("visibleBtn").onclick = () => setVisible(true);
$("stage").addEventListener("click", () => {
    if (document.body.classList.contains("visible")) setVisible(false);
});
document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) document.body.classList.remove("visible");
});

function tick() {
    const now = new Date();
    const wallSec = now.getSeconds() + now.getMilliseconds() / 1000;

    /* Time of day (large, left panel) */
    const tod = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    $("tod").textContent = tod;
    $("todOverlay").textContent = tod;

    if (mode === "session" && type !== "pace") {
        renderTimer();
        requestAnimationFrame(tick);
        return;
    }

    /* Pre-workout countdown */
    let preText = "";
    if (preEnd) {
        const rem = (preEnd - nowMs()) / 1000;
        if (rem <= 0) {
            preEnd = null;
            sessionStart = nowMs();
            running = true;
            lastCycle = null; lastCeil = null;
            startBeep();
            updateStartBtn();
        } else {
            const c = Math.ceil(rem);
            if (c !== preCeil) {
                if (c <= 3) countdownBeep();
                preCeil = c;
            }
            preText = String(c);
        }
    }
    $("preText").textContent = preText;

    /* Reference time for hands and send-off */
    let t;
    let elapsedSec = 0;
    if (mode === "wall") {
        t = now.getMinutes() * 60 + wallSec;
    } else if (running && sessionStart) {
        elapsedSec = (nowMs() - sessionStart) / 1000;
        t = elapsedSec;
    } else {
        t = 0;
    }

    HANDS.forEach(h => {
        const deg = ((t + h.offset) % 60) * 6;
        h.node.setAttribute("transform", `rotate(${deg} ${C} ${C})`);
    });

    /* Send-off countdown */
    const interval = currentInterval();
    const remaining = interval - (t % interval);
    const shown = (mode === "session" && !running) ? (preEnd ? Math.max(0, (preEnd - nowMs()) / 1000) : interval) : remaining;
    const tenths = Math.floor(shown * 10);
    const txt = `${pad(Math.floor(tenths / 600))}:${pad(Math.floor(tenths / 10) % 60)}.${tenths % 10}`;
    $("nextSend2").textContent = txt;
    $("bar").style.width = (preEnd ? 0 : (1 - shown / interval) * 100) + "%";

    if (mode === "session" && paceDisplay === "digital") {
        const preparing = preEnd !== null;
        const duration = preparing ? 10 : interval;
        const color = preparing ? COLORS.prep : COLORS.work;
        const circumference = 2 * Math.PI * 175;
        const ring = $("ringFg");
        ring.setAttribute("stroke", color);
        ring.setAttribute("stroke-dasharray", circumference);
        ring.setAttribute("stroke-dashoffset", circumference * Math.max(0, Math.min(1, shown / duration)));
        $("tLabel").textContent = preparing ? "PRÊT" : "INTERVALLES";
        $("tLabel").setAttribute("fill", color);
        $("tDigits").textContent = fmtMS(shown);
        $("tDigits").setAttribute("fill", color);
        $("tSub").textContent = preparing ? "Début de l’entraînement" : "Prochain départ";
    }

    const cycle = Math.floor(t / interval);
    const ceil = Math.ceil(remaining);
    if (mode === "wall" || running) {
        if (lastCycle !== null && cycle !== lastCycle) {
            startBeep();
        } else if (lastCeil !== null && ceil !== lastCeil && ceil <= 3 && ceil >= 1 && interval > 3) {
            countdownBeep();
        }
    }
    lastCycle = cycle;
    lastCeil = ceil;

    /* Elapsed: time of day in wall mode, session time otherwise */
    if (mode === "wall") {
        $("elapsed").textContent = tod;
    } else {
        const e = Math.floor(elapsedSec);
        $("elapsed").textContent = `${pad(Math.floor(e / 3600))}:${pad(Math.floor(e / 60) % 60)}:${pad(e % 60)}`;
    }

    requestAnimationFrame(tick);
}

setMode("session");
tick();
</script>

</body>
</html>
